<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatApp | SignalR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat">
    <header>
      <h1>ChatApp</h1>
      <span id="status" class="status status--off">Ej inloggad</span>
    </header>

    <p>Logga in med ett användarnamn för att börja chatta i realtid.</p>

    <form id="login-form" class="row">
      <input id="login-name" type="text" placeholder="Användarnamn" autocomplete="username" required>
      <button type="submit">Logga in</button>
      <button type="button" id="logout" class="secondary" hidden>Logga ut</button>
      <small>Användarnamnet används för att identifiera dig i chatten.</small>
    </form>

    <ul id="messages" class="messages" aria-live="polite"></ul>

    <form id="send-form" class="send">
      <input id="message" type="text" placeholder="Meddelande till alla (max 500 tecken)" autocomplete="off" required disabled>
      <button type="submit" disabled>Skicka</button>
    </form>
  </main>

  <script src="lib/signalr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
